name : CI/CD Deploy to Docker and Railway

on : [push]

jobs :
  build-docker :
    runs-on : ubuntu-latest
    env : 
        RAILWAY_TOKEN : ${{ secrets.RAILWAY_TOKEN }}
        SERVICE_ID : cb910381-4c80-4f6f-a0a4-58a4c519f2b4
    steps:
      - 
        name : Checkout repo
        uses : actions/checkout@v4
      -
        name: Login Docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context : ./src
          push: true
          tags: ${{ secrets. DOCKER_USERNAME }}/tugas-netics-1-2025:latest
      -
        name : Set up Node.js
        uses : actions/setup-node@v3
        with :
          node-version : 'latest'
      -
        name : Cache npm
        id : cache-npm
        uses : actions/cache@v3
        env :
          cache-name : cache-node
        with :
          path : ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      -
        name : Install Railway CLI
        run : nmp install -g @railway/cli
      -
        name : Deploy Railway
        run : railway up --service=$SERVICE_ID